name: Shopify Inventory Export

on:
  schedule:
    # 6AM, 8AM, 10AM, 12PM, 2PM, 4PM, 6PM Pacific (UTC-8 mapping)
    # Weekdays only (Mon–Fri)
    - cron: "0 14,16,18,20,22,0,2 * * 1-5"
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest

    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run inventory export
        run: |
          python inventory_pull.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopify_inventory_export
          path: shopify_inventory_export.csv
          retention-days: 30
