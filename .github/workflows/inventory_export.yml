name: Shopify Inventory Export

on:
  schedule:
    # 6AM, 8AM, 10AM, 12PM, 2PM, 4PM, 6PM Pacific (UTC-8 mapping), weekdays only
    - cron: "0 14,16,18,20,22,0,2 * * 1-5"
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
      SHOPIFY_STORE_DTC: ${{ secrets.SHOPIFY_STORE_DTC }}
      SHOPIFY_TOKEN_DTC: ${{ secrets.SHOPIFY_TOKEN_DTC }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run inventory export
        run: |
          python inventory_pull.py

      - name: Commit updated CSV (latest only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add exports/shopify_inventory_export.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update latest inventory export"
          git push
